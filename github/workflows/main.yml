name: scheduler

on: 
  schedule:
    - cron: '0 21 * * *'
  
  workflow_dispatch:

jobs:
  run-script:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: 
            node-version: "24"

      - uses: astral-sh/setup-uv@v5
        with: 
          version: "0.11.28"
          python-version: "3.14.6"
          enable-cache: true
      
      - run: uv sync --frozen

      - run: uv run playwright install --with-deps

      - env:
          USER: ${{secrets.DAIGLER_USER}}
          PASS: ${{secrets.DAIGLER_PASS}}
        run: uv run daigler.py

